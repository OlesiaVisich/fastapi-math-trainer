<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет учителя — Мои уроки</title>
  <style>
    :root {
      --primary: #3b6ea5;
      --primary-dark: #2f5a88;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #22303e;
      --muted: #6b7a8c;
      --border: #dde4ec;
      --danger: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 20px; font-weight: 600; }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 18px;
      font-size: 15px;
      opacity: .85;
    }
    nav a.active, nav a:hover { opacity: 1; font-weight: 600; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    h2 { margin-bottom: 16px; font-size: 22px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
    input[type="text"], input[type="date"], textarea, input[type="file"] {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: var(--primary-dark); }
    .lesson {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 14px;
      background: var(--card);
    }
    .lesson-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .lesson-topic { font-size: 17px; font-weight: 600; }
    .lesson-date { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .lesson-desc { margin-top: 8px; font-size: 14px; white-space: pre-wrap; }
    .lesson-hw { margin-top: 8px; font-size: 14px; }
    .lesson-hw b { color: var(--primary-dark); }
    .lesson-footer { margin-top: 10px; display: flex; gap: 14px; align-items: center; font-size: 14px; }
    .lesson-footer a { color: var(--primary); text-decoration: none; }
    .lesson-footer a:hover { text-decoration: underline; }
    .pdf-none { color: var(--muted); }
    .btn-del {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 12px;
      font-size: 13px;
      margin-top: 0;
      margin-left: auto;
    }
    .btn-del:hover { background: var(--danger); color: #fff; }
    .empty { color: var(--muted); font-size: 15px; padding: 8px 0; }
    .message { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; display: none; }
    .message.ok { display: block; background: #e6f4ea; color: #1e7e34; }
    .message.err { display: block; background: #fdecea; color: var(--danger); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Кабинет учителя</h1>
    <nav>
      <a href="/" class="active">Мои уроки</a>
    </nav>
  </header>

  <main>
    <div id="message" class="message"></div>

    <section class="card">
      <h2>Создать урок</h2>
      <form id="lesson-form">
        <label for="topic">Тема урока *</label>
        <input type="text" id="topic" name="topic" required placeholder="Например: Квадратные уравнения">

        <label for="description">Текстовое описание</label>
        <textarea id="description" name="description" placeholder="План урока, цели, заметки…"></textarea>

        <label for="date">Дата урока</label>
        <input type="date" id="date" name="date">

        <label for="homework">Домашняя работа</label>
        <textarea id="homework" name="homework" placeholder="Номера упражнений, страницы…"></textarea>

        <label for="tasks_pdf">Файл с задачами (PDF)</label>
        <input type="file" id="tasks_pdf" name="tasks_pdf" accept=".pdf,application/pdf">
        <div class="hint">Загрузите PDF с задачами на урок.</div>

        <button type="submit">Создать урок</button>
      </form>
    </section>

    <section>
      <h2>Мои уроки</h2>
      <div id="lessons"></div>
    </section>
  </main>

  <script>
    const lessonsEl = document.getElementById('lessons');
    const formEl = document.getElementById('lesson-form');
    const messageEl = document.getElementById('message');

    function showMessage(text, ok) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + (ok ? 'ok' : 'err');
      setTimeout(() => { messageEl.className = 'message'; }, 4000);
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s == null ? '' : String(s);
      return div.innerHTML;
    }

    async function loadLessons() {
      const res = await fetch('/lessons/');
      if (!res.ok) { showMessage('Не удалось загрузить уроки', false); return; }
      const lessons = await res.json();
      if (!lessons.length) {
        lessonsEl.innerHTML = '<div class="empty">Пока нет ни одного урока — создайте первый выше.</div>';
        return;
      }
      lessonsEl.innerHTML = lessons.map(l => `
        <div class="lesson">
          <div class="lesson-top">
            <div class="lesson-topic">${escapeHtml(l.topic)}</div>
            <div class="lesson-date">${l.date ? formatDate(l.date) : ''}</div>
          </div>
          ${l.description ? `<div class="lesson-desc">${escapeHtml(l.description)}</div>` : ''}
          ${l.homework ? `<div class="lesson-hw"><b>Домашняя работа:</b> ${escapeHtml(l.homework)}</div>` : ''}
          <div class="lesson-footer">
            ${l.pdf_filename
              ? `<a href="/lessons/${l.id}/pdf" download>📎 Скачать задачи (PDF)</a>`
              : '<span class="pdf-none">PDF с задачами не прикреплён</span>'}
            <button class="btn-del" onclick="deleteLesson(${l.id})">Удалить</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteLesson(id) {
      if (!confirm('Удалить этот урок?')) return;
      const res = await fetch('/lessons/' + id, { method: 'DELETE' });
      if (res.ok) {
        showMessage('Урок удалён', true);
        loadLessons();
      } else {
        showMessage('Не удалось удалить урок', false);
      }
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(formEl);
      if (!data.get('topic')) { showMessage('Укажите тему урока', false); return; }
      const res = await fetch('/lessons/', { method: 'POST', body: data });
      if (res.ok) {
        showMessage('Урок создан', true);
        formEl.reset();
        loadLessons();
      } else {
        const err = await res.json().catch(() => ({}));
        showMessage(err.detail ? JSON.stringify(err.detail) : 'Ошибка при создании урока', false);
      }
    });

    loadLessons();
  </script>
</body>
</html>
